name: Test, publish, and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run API tests
        run: dotnet test backend/SupportTracker.Tests/SupportTracker.Tests.csproj --configuration Release

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/support-tracker:assessment
            ${{ vars.DOCKERHUB_USERNAME }}/support-tracker:${{ github.sha }}

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy the commit image to Azure
        env:
          IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/support-tracker:${{ github.sha }}
        run: |
          az containerapp update \
            --name support-tracker \
            --resource-group rg-support-tracker-assessment \
            --image "$IMAGE" \
            --only-show-errors \
            --output none

      - name: Verify the deployed revision and login challenge
        env:
          IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/support-tracker:${{ github.sha }}
        run: |
          revision=$(az containerapp show --name support-tracker --resource-group rg-support-tracker-assessment --query properties.latestRevisionName -o tsv)
          deployed_image=$(az containerapp revision show --name support-tracker --resource-group rg-support-tracker-assessment --revision "$revision" --query 'properties.template.containers[0].image' -o tsv)
          test "$deployed_image" = "$IMAGE"
          for attempt in $(seq 1 24); do
            state=$(az containerapp revision show --name support-tracker --resource-group rg-support-tracker-assessment --revision "$revision" --query properties.healthState -o tsv)
            if [ "$state" = Healthy ]; then
              status=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' https://support-tracker.bluesky-bc9ab669.southeastasia.azurecontainerapps.io/api/tickets/summary || true)
              if [ "$status" = 401 ]; then
                echo "Revision $revision is healthy and the demo login is active."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "The new revision did not become healthy with login enabled in time." >&2
          exit 1
