services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:-LocalOnly_Strong123!}"
    ports: ["1433:1433"]
    volumes: ["sql_data:/var/opt/mssql"]
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      ConnectionStrings__Tickets: "Server=sqlserver,1433;Database=SupportTracker;User Id=sa;Password=${SQL_PASSWORD:-LocalOnly_Strong123!};TrustServerCertificate=True"
    depends_on: [sqlserver]
volumes:
  sql_data:
